name: Release

# On tag v* : build the SPA, generate i18n files, assemble a distribution zip
# (with build/, without node_modules/src) and attach it to the GitHub Release.
# Client sites auto-update from these release assets via plugin-update-checker.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Optional Ed25519 release signing key (base64 of the 64-byte sodium
      # secret key). Without the secret the zip ships unsigned, as before.
      UXSTUDIO_SIGNING_KEY: ${{ secrets.UXSTUDIO_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard - forbidden strings
        run: |
          # Forbid re-branding as the old plugin: the PHP namespace (Wpextended\)
          # and its text-domain constant. Legacy option NAMES (wpextended__*),
          # interop path checks (WP_EXTENDED_PATH) and explanatory comments are
          # allowed - they read/detect legacy data, they are not new branding.
          ! grep -rnE --include="*.php" --include="*.ts" --include="*.tsx" --include="*.scss" \
              'Wpextended\\|WP_EXTENDED_TEXT_DOMAIN' includes src ux-studio.php
          # Plugin chrome uses lucide, not dashicons. A placeholder hint for WP's
          # own admin-menu icon field (which IS a dashicon) is allowed.
          ! { grep -rn --include="*.tsx" --include="*.ts" 'dashicons' src | grep -v 'placeholder='; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # The bundle filenames carry a content hash (webpack.config.js). The hash
      # CI produces can differ from the local build the committed JSON targeted,
      # so re-point the merged translation JSON at THIS build's index filename.
      # (PHP only - no wp-cli/make-pot, which would choke on the minified build.)
      - name: Align translations with this build's hashed bundle
        run: php bin/merge-json-translations.php

      # Translations (languages/*.pot|po|mo|json) are maintained IN THE REPO and
      # ship as-is in the zip below. Regenerate them locally, not in CI:
      #   wp i18n make-pot . languages/ux-studio.pot --include=includes,build,ux-studio.php --exclude=node_modules,vendor,src
      #   wp i18n update-po languages/ux-studio.pot languages/ux-studio-cs_CZ.po   # then translate new strings
      #   wp i18n make-mo languages/ux-studio-cs_CZ.po languages/
      #   wp i18n make-json languages/ --no-purge && php bin/merge-json-translations.php
      # (CI can't run make-pot over the minified build/ JS: Xdebug + the JS parser
      # abort on deep recursion.)

      - name: Assemble distribution zip
        run: |
          mkdir -p dist/ux-studio
          rsync -a --exclude node_modules --exclude .git --exclude .github \
                --exclude src --exclude dist --exclude "*.zip" ./ dist/ux-studio/
          cd dist && zip -rq ux-studio.zip ux-studio

      # Detached Ed25519 signature over the zip's SHA-384 hash (base64), checked
      # by Core\GithubUpdater before install when a public key is configured.
      - name: Sign distribution zip
        if: env.UXSTUDIO_SIGNING_KEY != ''
        run: |
          php -r '
            $sk = base64_decode( trim( (string) getenv( "UXSTUDIO_SIGNING_KEY" ) ), true );
            if ( false === $sk || SODIUM_CRYPTO_SIGN_SECRETKEYBYTES !== strlen( $sk ) ) { fwrite( STDERR, "Invalid UXSTUDIO_SIGNING_KEY" . PHP_EOL ); exit( 1 ); }
            $sig = sodium_crypto_sign_detached( hash_file( "sha384", "dist/ux-studio.zip", true ), $sk );
            if ( ! sodium_crypto_sign_verify_detached( $sig, hash_file( "sha384", "dist/ux-studio.zip", true ), sodium_crypto_sign_publickey_from_secretkey( $sk ) ) ) { exit( 1 ); }
            file_put_contents( "dist/ux-studio.zip.sig", base64_encode( $sig ) );
            echo "Signed with public key ", base64_encode( sodium_crypto_sign_publickey_from_secretkey( $sk ) ), PHP_EOL;
          '

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          # The .sig only exists when the signing secret is set (unmatched
          # patterns are skipped, not fatal).
          files: |
            dist/ux-studio.zip
            dist/ux-studio.zip.sig
          generate_release_notes: true
