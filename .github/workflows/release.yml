name: Release

# On tag v* : build the SPA, generate i18n files, assemble a distribution zip
# (with build/, without node_modules/src) and attach it to the GitHub Release.
# Client sites auto-update from these release assets via plugin-update-checker.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Guard - forbidden strings
        run: |
          # Forbid re-branding as the old plugin: the PHP namespace (Wpextended\)
          # and its text-domain constant. Legacy option NAMES (wpextended__*),
          # interop path checks (WP_EXTENDED_PATH) and explanatory comments are
          # allowed - they read/detect legacy data, they are not new branding.
          ! grep -rnE --include="*.php" --include="*.ts" --include="*.tsx" --include="*.scss" \
              'Wpextended\\|WP_EXTENDED_TEXT_DOMAIN' includes src ux-studio.php
          # Plugin chrome uses lucide, not dashicons. A placeholder hint for WP's
          # own admin-menu icon field (which IS a dashicon) is allowed.
          ! { grep -rn --include="*.tsx" --include="*.ts" 'dashicons' src | grep -v 'placeholder='; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Translations (languages/*.pot|po|mo|json) are maintained IN THE REPO and
      # ship as-is in the zip below. Regenerate them locally, not in CI:
      #   wp i18n make-pot . languages/ux-studio.pot --include=includes,build,ux-studio.php --exclude=node_modules,vendor,src
      #   wp i18n update-po languages/ux-studio.pot languages/ux-studio-cs_CZ.po   # then translate new strings
      #   wp i18n make-mo languages/ux-studio-cs_CZ.po languages/
      #   wp i18n make-json languages/ --no-purge && php bin/merge-json-translations.php
      # (CI can't run make-pot over the minified build/ JS: Xdebug + the JS parser
      # abort on deep recursion.)

      - name: Assemble distribution zip
        run: |
          mkdir -p dist/ux-studio
          rsync -a --exclude node_modules --exclude .git --exclude .github \
                --exclude src --exclude dist --exclude "*.zip" ./ dist/ux-studio/
          cd dist && zip -rq ux-studio.zip ux-studio

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ux-studio.zip
          generate_release_notes: true
